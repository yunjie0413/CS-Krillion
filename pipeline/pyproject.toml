[project]
name = "cs2-krillion-data"
version = "0.1.0"
description = "Builds CS2 Krillion-style prompts and answer sets from Liquipedia's LPDB API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cskrill = "cskrill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cskrill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
